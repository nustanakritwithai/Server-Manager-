name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simcore
          POSTGRES_PASSWORD: simcore
          POSTGRES_DB: simcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simcore -d simcore_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest
        env:
          SIMCORE_TEST_DATABASE_URL: postgresql+psycopg://simcore:simcore@127.0.0.1:5432/simcore_test
        run: pytest

  simulator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simcore
          POSTGRES_PASSWORD: simcore
          POSTGRES_DB: simcore_sim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simcore -d simcore_sim"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Create the second fresh database
        run: |
          python - <<'PY'
          import psycopg
          last = None
          conn = None
          for name in ("postgres", "simcore_sim"):
              try:
                  conn = psycopg.connect(
                      f"host=127.0.0.1 dbname={name} user=simcore password=simcore",
                      autocommit=True,
                  )
                  break
              except Exception as exc:
                  last = exc
          if conn is None:
              raise SystemExit(f"could not open a database to create simcore_sim_b: {last}")
          conn.execute("CREATE DATABASE simcore_sim_b OWNER simcore")
          PY

      - name: First CI run
        env:
          SIMCORE_DATABASE_URL: postgresql+psycopg://simcore:simcore@127.0.0.1:5432/simcore_sim
          SIMCORE_ENV: development
          SIMCORE_ADMIN_TOKEN: dev-admin
          SIMCORE_WORKER_ID: simulator
        run: |
          python -m simcore.sim --mode full --players 4 --seed 8741 --ticks 2 --command-rate 1 --report-dir sim-reports/a

      - name: Second CI run
        env:
          SIMCORE_DATABASE_URL: postgresql+psycopg://simcore:simcore@127.0.0.1:5432/simcore_sim_b
          SIMCORE_ENV: development
          SIMCORE_ADMIN_TOKEN: dev-admin
          SIMCORE_WORKER_ID: simulator
        run: |
          python -m simcore.sim --mode full --players 4 --seed 8741 --ticks 2 --command-rate 1 --report-dir sim-reports/b

      - name: Same seed must match
        run: |
          python - <<'PY'
          import json, pathlib, sys
          first = json.loads(pathlib.Path("sim-reports/a/report.json").read_text())
          second = json.loads(pathlib.Path("sim-reports/b/report.json").read_text())
          errors = []
          if first["result"] != "PASS":
              errors.append("run A failed: " + json.dumps(first["failed_invariants"]))
          if second["result"] != "PASS":
              errors.append("run B failed: " + json.dumps(second["failed_invariants"]))
          if first.get("world_checksum") != second.get("world_checksum"):
              errors.append(f"checksum {first.get('world_checksum')} != {second.get('world_checksum')}")
          if first.get("command_sequence") != second.get("command_sequence"):
              errors.append("command sequences differ")
          for label, report in (("A", first), ("B", second)):
              auth = report.get("auth_coverage") or {}
              if auth.get("verdict") != "COMPLETE":
                  errors.append(label + " auth coverage " + json.dumps(auth.get("gaps")))
              game = report.get("coverage") or {}
              if game.get("verdict") != "COMPLETE":
                  errors.append(label + " coverage " + str(game.get("verdict")) + " " + json.dumps(game.get("gaps")))
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(first["world_checksum"])
          PY

      - name: Upload simulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-reports
          path: sim-reports/
