name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simcore
          POSTGRES_PASSWORD: simcore
          POSTGRES_DB: simcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simcore -d simcore_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest
        env:
          SIMCORE_TEST_DATABASE_URL: postgresql+psycopg://simcore:simcore@127.0.0.1:5432/simcore_test
        run: pytest
