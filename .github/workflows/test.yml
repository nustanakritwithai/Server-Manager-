name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simcore
          POSTGRES_PASSWORD: simcore
          POSTGRES_DB: simcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simcore -d simcore_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest
        env:
          SIMCORE_TEST_DATABASE_URL: postgresql+psycopg://simcore:simcore@127.0.0.1:5432/simcore_test
        run: pytest

  simulator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simcore
          POSTGRES_PASSWORD: simcore
          POSTGRES_DB: simcore_sim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simcore -d simcore_sim"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Repeated full scenarios
        env:
          SIMCORE_ENV: development
          SIMCORE_ADMIN_TOKEN: dev-admin
          SIMCORE_WORKER_ID: simulator
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          import psycopg

          runs = 10
          names = [f"simcore_sim_{index}" for index in range(1, runs + 1)]

          def recreate(name: str) -> None:
              last = None
              conn = None
              for catalog in ("postgres", "simcore_sim"):
                  try:
                      conn = psycopg.connect(
                          f"host=127.0.0.1 dbname={catalog} user=simcore password=simcore",
                          autocommit=True,
                      )
                      break
                  except Exception as exc:
                      last = exc
              if conn is None:
                  raise SystemExit(f"could not open a database to create {name}: {last}")
              conn.execute(f'DROP DATABASE IF EXISTS "{name}" WITH (FORCE)')
              conn.execute(f'CREATE DATABASE "{name}" OWNER simcore')
              conn.close()

          env = os.environ.copy()
          reports = []
          for index, name in enumerate(names, start=1):
              recreate(name)
              report_dir = pathlib.Path("sim-reports") / f"run-{index}"
              env["SIMCORE_DATABASE_URL"] = f"postgresql+psycopg://simcore:simcore@127.0.0.1:5432/{name}"
              completed = subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "simcore.sim",
                      "--mode",
                      "full",
                      "--players",
                      "4",
                      "--seed",
                      "8741",
                      "--ticks",
                      "2",
                      "--command-rate",
                      "1",
                      "--report-dir",
                      str(report_dir),
                  ],
                  env=env,
                  check=False,
              )
              if completed.returncode != 0:
                  raise SystemExit(f"run {index} failed with exit {completed.returncode}")
              reports.append(json.loads((report_dir / "report.json").read_text()))

          errors = []
          first = reports[0]
          for index, report in enumerate(reports, start=1):
              if report["result"] != "PASS":
                  errors.append(f"run {index} failed: " + json.dumps(report["failed_invariants"]))
              if report.get("world_checksum") != first.get("world_checksum"):
                  errors.append(
                      f"run {index} checksum {report.get('world_checksum')} != {first.get('world_checksum')}"
                  )
              if report.get("command_sequence") != first.get("command_sequence"):
                  errors.append(f"run {index} command sequence differs")
              auth = report.get("auth_coverage") or {}
              if auth.get("verdict") != "COMPLETE":
                  errors.append(f"run {index} auth coverage " + json.dumps(auth.get("gaps")))
              game = report.get("coverage") or {}
              if game.get("verdict") != "COMPLETE":
                  errors.append(
                      f"run {index} coverage " + str(game.get("verdict")) + " " + json.dumps(game.get("gaps"))
                  )
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"{runs} runs {first['world_checksum']}")
          PY

      - name: Upload simulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-reports
          path: sim-reports/
